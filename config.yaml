# ---------------------------------------------------------------------------
# Vigia - configuracion activa.
# Casi todo se puede cambiar desde el panel (boton Ajustes); si editas a mano,
# Vigia avisa en el log y usa el valor por defecto cuando algo esta mal.
# Referencia completa y comentada: config.example.yaml
# ---------------------------------------------------------------------------

# Fichero SQLite de eventos.
almacen: vigia.db

# --- captura ---------------------------------------------------------------
# 640x480 es el punto dulce de una webcam normal (~14 fps).
# Cambiar ancho/alto requiere reiniciar el dashboard.
ancho: 640
alto: 480

# --- reglas ----------------------------------------------------------------
# Segundos de presencia para disparar `permanencia`.
permanencia_seg: 30

# Segundos sin ver a una persona para anunciar `persona_salio`.
timeout_persona_seg: 10

# Segundos sin ver un objeto vigilado para `objeto_desaparece`.
timeout_objeto_seg: 10

# Clases COCO cuyo aparecer/desaparecer se registra.
vigilar_desaparicion:
  - laptop
  - backpack
  - cell phone

# Zonas: nombre -> [x1, y1, x2, y2] en pixeles. Dibujarlas desde el panel.
zonas: {}

# Franjas activas (HH:MM). Vacio = siempre activo.
franjas: []

# --- media -----------------------------------------------------------------
# MP4 de los segundos previos en los eventos importantes.
guardar_clips: true

# JPEG del instante en todos los eventos (historico visual).
miniaturas: true

# --- mantenimiento ---------------------------------------------------------
# 0 = no purgar nunca.
retencion_dias: 30
retencion_clips_dias: 14
retencion_clips_mb: 2048
mantener_cada_min: 60

# --- extras ----------------------------------------------------------------
notificar: true

# Segunda pasada de pose (descarga yolo11n-pose.pt la primera vez; baja FPS).
actividades: true

# Caras: deteccion YuNet + identidad SFace (descarga ~40MB onnx la primera vez).
# Registras conocidos en la BD (tabla rostros); desconocidos -> evento cara_desconocida.
caras: true
