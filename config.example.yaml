# Vigia — configuracion de ejemplo.
# Copia este fichero a `config.yaml` y ajusta lo que necesites.
# Si algo esta mal escrito, Vigia avisa en el log y usa el valor por defecto.
# Casi todo esto se puede cambiar tambien desde el panel (boton Ajustes).

# Fichero SQLite de eventos (relativo a la carpeta del proyecto).
almacen: vigia.db

# --- servicio --------------------------------------------------------------
# Donde escucha el panel. Las variables VIGIA_HOST / VIGIA_PUERTO ganan.
# Sin VIGIA_TOKEN solo se permite 127.0.0.1; con host de red exige token.
host: 127.0.0.1
puerto: 8000

# --- captura ---------------------------------------------------------------
# 640x480 es el punto dulce de una webcam normal (~14 fps). Subir a 1280x720
# reduce los FPS. Cambiarlo requiere reiniciar el dashboard.
ancho: 640
alto: 480
# Indice de la webcam (0 = la primera). Se cambia en caliente desde el panel.
camara: 0

# --- reglas ----------------------------------------------------------------
# Segundos que una persona debe permanecer para disparar `permanencia`.
permanencia_seg: 30

# Segundos sin ver una persona para anunciar `persona_salio`.
timeout_persona_seg: 10

# Segundos sin ver un objeto vigilado para anunciar `objeto_desaparece`.
timeout_objeto_seg: 10

# Segundos que un ID debe verse seguido antes de anunciar `persona_entra`
# (filtra detecciones fugaces).
confirmar_entrada_seg: 1.0
# Un ID nuevo que aparece donde otro acaba de desaparecer (en estos segundos)
# se considera la misma persona: evita `persona_entra` falsos y que se
# reinicie la permanencia cuando el tracker cambia de ID.
reasociar_seg: 8

# Clases COCO cuyo aparecer/desaparecer quieres registrar.
vigilar_desaparicion:
  - laptop
  - backpack
  - cell phone

# Zonas: cajas o poligonos con reglas propias. El formato antiguo
# `nombre: [x1, y1, x2, y2]` se sigue aceptando.
# Lo mas comodo es dibujarlas desde el panel (boton Zonas).
zonas:
  puerta:
    caja: [0, 0, 200, 480]
    permanencia_seg: 20          # null = usa permanencia_seg global
    restringida: false
    excluir: false
  mesa:
    caja: [300, 200, 640, 480]
    vigilar: [laptop, cell phone]
    max_personas: 2
  espejo:
    poligono: [[10, 10], [120, 10], [120, 90], [10, 90]]
    excluir: true                # lo que caiga aqui no genera eventos

# Franjas horarias en las que las reglas del motor estan activas (HH:MM).
# franjas:
#   - {desde: "22:00", hasta: "08:00"}
franjas: []

# --- reglas por zona / personas (bloque 4) ---------------------------------
# Segundos para que un conocido dispare permanencia (0 = nunca).
permanencia_conocidos_seg: 0
# Re-aviso mientras la persona sigue en la zona (0 = solo una vez).
reaviso_min: 0
# Merodeo: numero de re-entradas dentro de la ventana.
merodeo_entradas: 3
merodeo_ventana_seg: 120
# Inmovilidad (posible caida); 0 lo desactiva.
inmovil_seg: 0
inmovil_px: 20
# Maximo global de personas a la vez (0 = sin limite).
max_personas: 0

# --- media -----------------------------------------------------------------
# Guardar un clip WebM de los segundos previos en los eventos importantes.
guardar_clips: true
# Guardar un JPEG del instante en *todos* los eventos (historico visual).
miniaturas: true

# --- mantenimiento ---------------------------------------------------------
# Dias de eventos a conservar (0 = no purgar nunca).
retencion_dias: 30
# Dias de clips y miniaturas a conservar (0 = no purgar por edad).
retencion_clips_dias: 14
# Tope de tamano de la carpeta de media en MB (0 = sin tope).
retencion_clips_mb: 2048
# Cada cuantos minutos se ejecuta la purga mientras el dashboard esta abierto.
mantener_cada_min: 60

# --- extras ----------------------------------------------------------------
# Aviso (toast) de Windows en permanencia y objetos desaparecidos.
notificar: true
# Segunda pasada de pose para clasificar actividades (descarga el modelo
# yolo11n-pose.pt la primera vez; baja los FPS).
actividades: false
# Modelo de pose: n/s/m (se descarga solo) o ruta a un .pt. `pose_imgsz`
# controla el coste: 640 es el equilibrio en la RTX 3060 (~15+ fps).
pose_modelo: n
pose_imgsz: 640
# Keypoints por debajo de esta confianza se descartan y se mantiene el
# ultimo valor valido ~1 s (filtro One-Euro adaptativo).
conf_kpt: 0.3
suavizar_kpts: true
# Dibujar el esqueleto por colores sobre el video (detras de las cajas).
dibujar_esqueleto: true
# Caras: YuNet (deteccion) + SFace (identidad), modelos onnx descargados
# automaticamente (~40MB) a `modelos/`. Conocidos en la tabla `rostros`.
caras: false

# --- percepcion: entradas/salidas y re-ID (ronda 3) -----------------------
# Aparicion lejos del borde: exige mas tiempo (sombras/reflejos en el centro).
confirmar_interior_seg: 2.5
# Confianza media y alto minimo (fraccion del frame) para confirmar entrada.
entrada_conf_min: 0.35
entrada_alto_min: 0.08
# Timeout adaptativo de salida: borde (se fue) y centro (probable oclusion).
timeout_borde_seg: 2.0
timeout_centro_seg: 12.0
# Re-identificacion ligera por histograma HSV del torso al reasociar IDs.
reid: true
reid_sim_min: 0.55
# Caidas: de pie/caminando -> tumbado + inmovilidad.
caida_activa: true
caida_inmovil_seg: 5
# Cache de /vivo en segundos (la GUI lo consulta a ~6 Hz).
vivo_cache_seg: 0.2

# --- Telegram (bloque 2) ---------------------------------------------------
# Los secretos NO van aqui: TELEGRAM_TOKEN y TELEGRAM_CHAT_ID en `.env`
# (o en el entorno). Aqui solo se activa y se ajusta el comportamiento.
telegram: false
# Prioridad por tipo de evento: info (no se envia), aviso o critico.
telegram_prioridades:
  cara_desconocida: critico
  permanencia: aviso
  objeto_desaparece: aviso
  zona_restringida: critico
  demasiadas_personas: aviso
  merodeo: aviso
  persona_inmovil: critico
  persona_entra: info
  persona_salio: info
# Anti-spam: maximo de avisos por hora y espera por (tipo, persona/zona).
telegram_max_hora: 20
telegram_cooldown_seg: 300

# --- armado ----------------------------------------------------------------
# false = solo manual (boton, /armar y /desarmar). Con true se arma solo
# dentro de `armado_franjas` (si esta vacio, usa `franjas`).
armado_auto: false
armado_franjas: []

# --- avisos del sistema ----------------------------------------------------
# Camara caida durante X segundos y aviso si el disco baja de X GB.
avisos_camara_seg: 300
avisos_disco_gb: 5
